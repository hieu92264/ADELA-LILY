<section id="ket-qua-hoc-vien" class="bg-white pb-[34px] pt-[22px]">
  <div class="mx-auto w-[min(100%-2rem,990px)]">
    <div class="flex justify-center">
      <h2 class="student-result-title rounded-[10px] border border-[#0b3474] bg-white px-[26px] py-[19px] text-center text-[clamp(20px,2.2vw,27px)] font-black uppercase leading-none tracking-normal text-[#0b3474]">
        Con bứt phá thành tích sau 1 khoá học
      </h2>
    </div>

    <div class="student-result-slider relative mt-[30px]" data-student-result-slider aria-label="Video kết quả học viên">
      <button
        class="student-result-nav student-result-nav-prev"
        type="button"
        data-student-result-prev
        aria-label="Video trước"
      >
        &lsaquo;
      </button>

      <div class="student-result-viewport overflow-hidden">
        <div class="student-result-track" data-student-result-track>
        <article class="student-result-video">
          <iframe
            class="h-full w-full"
            src="https://www.youtube.com/embed/nvTioKg-7Yo?rel=0&modestbranding=1"
            title="Kết quả học viên ADELA 1"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
          ></iframe>
        </article>

        <article class="student-result-video">
          <iframe
            class="h-full w-full"
            src="https://www.youtube.com/embed/PHTrWMuqYjQ?rel=0&modestbranding=1"
            title="Kết quả học viên ADELA 2"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
          ></iframe>
        </article>

        <article class="student-result-video">
          <iframe
            class="h-full w-full"
            src="https://www.youtube.com/embed/o4HZhhyGa_Y?rel=0&modestbranding=1"
            title="Kết quả học viên ADELA 3"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
          ></iframe>
        </article>
        </div>
      </div>

      <button
        class="student-result-nav student-result-nav-next"
        type="button"
        data-student-result-next
        aria-label="Video tiếp theo"
      >
        &rsaquo;
      </button>
    </div>
  </div>
</section>
