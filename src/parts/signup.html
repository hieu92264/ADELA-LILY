<section id="dang-ky-hoc-thu" class="signup-section bg-white">
  <div class="signup-wrap mx-auto grid w-[min(100%,1362px)] items-end lg:grid-cols-[790px_572px]">
    <div class="signup-visual">
      <img
        src="/assets/images/signup/02.png"
        alt="Phụ huynh và học sinh vui vẻ khi học cùng ADELA"
        class="h-full w-full object-cover object-left-bottom"
      />
    </div>

    <div class="signup-panel mx-auto w-[min(100%-2rem,572px)] rounded-[8px] bg-[#07326e] px-[44px] pb-[31px] pt-[27px] text-center text-white">
      <div class="rounded-full border border-white px-6 py-[7px]">
        <h2 class="text-[28px] font-black uppercase leading-none tracking-normal text-white">
          Tổ chức giáo dục ADELA
        </h2>
      </div>
      <p class="mt-[17px] text-[14px] font-black uppercase leading-none text-white">
        Đơn vị tiên phong chuyên nghiệp hóa mô hình gia sư tại Việt Nam
      </p>

      <div class="signup-student mx-auto mt-[12px]">
        <img
          src="/assets/images/signup/01.png"
          alt="Học sinh ADELA bứt phá kết quả học tập"
          class="h-full w-full object-contain"
        />
      </div>

      <div
        class="signup-countdown mx-auto -mt-[2px] rounded-[7px] bg-white px-[28px] pb-[11px] pt-[8px] text-black"
        data-countdown
        data-countdown-duration="16051"
      >
        <p class="text-[15px] font-black leading-none text-black">Thời gian đăng ký:</p>
        <div class="mt-[8px] flex justify-center gap-[9px]">
          <div class="signup-time">
            <span data-countdown-days>00</span>
            <small>Ngày</small>
          </div>
          <div class="signup-time">
            <span data-countdown-hours>04</span>
            <small>Giờ</small>
          </div>
          <div class="signup-time">
            <span data-countdown-minutes>27</span>
            <small>Phút</small>
          </div>
          <div class="signup-time">
            <span data-countdown-seconds>31</span>
            <small>Giây</small>
          </div>
        </div>
      </div>

      <form class="signup-form mt-[15px] rounded-[4px] bg-[#eef8ff] px-[14px] pb-[27px] pt-[20px]">
        <h3 class="text-[21px] font-black uppercase leading-none text-[#244a8f]">
          Ba mẹ vui lòng để lại thông tin
        </h3>
        <p class="mt-[15px] min-h-[20px] text-[16px] font-medium leading-none text-black">
          <span
            data-typewriter
            data-typewriter-text="Đặt lịch test & học thử miễn phí"
          ></span>
          <span class="typewriter-caret">|</span>
        </p>

        <div class="mt-[25px] grid gap-[10px] sm:grid-cols-2">
          <input type="text" name="parent-name" placeholder="Họ tên phụ huynh" />
          <input type="tel" name="phone" placeholder="Số điện thoại" />
          <select name="grade" aria-label="Lớp con đang học">
            <option>Lớp con đang học...</option>
            <option>Tiểu học</option>
            <option>THCS</option>
            <option>THPT</option>
          </select>
          <select name="format" aria-label="Chọn hình thức học">
            <option>Chọn hình thức học</option>
            <option>Học tại trung tâm</option>
            <option>Học online</option>
            <option>Gia sư 1 kèm 1 tại nhà</option>
          </select>
        </div>

        <button class="signup-submit-button mt-[18px]" type="submit">
          Nhận tư vấn
        </button>
      </form>
    </div>
  </div>
</section>
