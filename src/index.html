<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="A Tailwind CSS landing page scaffold for cloning modern marketing pages with reusable HTML sections."
    />
    <title>Adela Landing Page</title>
    <link
      rel="preconnect"
      href="https://images.unsplash.com"
    />
    <link
      rel="stylesheet"
      href="/css/input.css"
    />
  </head>
  <body class="antialiased">
    <div data-include="header"></div>

    <main id="home">
      <!-- section hero -->
      <div data-include="hero"></div>
      <!-- section stats -->
      <div data-include="stats"></div>
      <!-- section about -->
      <div data-include="about"></div>
      <!-- section difference -->
      <div data-include="difference"></div>
      <!-- section process -->
      <div data-include="process"></div>
      <!-- section tutors -->
      <div data-include="tutors"></div>
      <!-- section commitments -->
      <div data-include="commitments"></div>
      <!-- section parent testimonials -->
      <div data-include="parent"></div>
      <!-- section program -->
      <div data-include="program"></div>
      <!-- section student result -->
      <div data-include="studentResult"></div>
      <!-- section signup -->
      <div data-include="signup"></div>
    </main>

    <div data-include="footer"></div>
    <div data-include="floatingContact"></div>
    <script
      type="module"
      src="/js/main.js"
    ></script>
  </body>
</html>
